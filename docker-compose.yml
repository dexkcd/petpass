services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: petpass
      POSTGRES_PASSWORD: petpass
      POSTGRES_DB: petpass
    ports:
      - "5432:5432"
    volumes:
      - petpass-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petpass"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  petpass-db:
